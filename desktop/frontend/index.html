<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cairn</title>
    <link rel="stylesheet" href="/src/style.css"/>
</head>
<body>
<main class="launcher">
    <!-- On macOS this band is the window's title bar (traffic lights inset on
         the left); on Linux it is the search bar under GTK's own title bar. -->
    <header class="titleband">
        <label id="search-field" class="search">
            <svg class="search-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input id="query" class="query" type="search" placeholder="Search bookmarks" aria-label="Search bookmarks"
                   autocomplete="off" spellcheck="false" autofocus/>
        </label>
        <button id="add-btn" class="icon-btn" type="button" aria-label="Add bookmark" title="Add bookmark">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
        <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Main menu" aria-haspopup="menu"
                title="Main menu">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
    </header>

    <!-- Persistent problems (sync sign-in expired, …); see src/messages.ts. -->
    <div class="banner-region" role="status">
        <div id="banner" class="banner" hidden>
            <svg class="warn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M12 10v4M12 17.5v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="banner-text" class="banner-text"></span>
            <button id="banner-dismiss" class="banner-dismiss" type="button">Dismiss</button>
        </div>
    </div>

    <section id="search-view" class="view">
        <ul id="results" class="results" role="listbox" aria-label="Bookmarks"></ul>
    </section>

    <!-- Add Bookmark: a sheet under the title band on macOS, a centred dialog
         over the dimmed window on Linux (see "Add Bookmark dialog" in style.css). -->
    <dialog id="add-dialog" class="add-dialog" aria-labelledby="add-title">
        <form id="add-form" class="add-form" method="dialog">
            <h2 id="add-title" class="add-title">Add Bookmark</h2>
            <div class="add-fields">
                <label class="field">
                    <span>URL</span>
                    <input id="add-url" type="text" placeholder="https://…" autocomplete="off" spellcheck="false"/>
                </label>
                <label class="field">
                    <span>Tags</span>
                    <input id="add-tags" type="text" placeholder="comma separated" autocomplete="off"
                           spellcheck="false" aria-describedby="add-note"/>
                </label>
                <p id="add-note" class="add-note">Title and description are fetched automatically.</p>
                <p id="add-message" class="add-message" role="status"></p>
            </div>
            <div class="add-actions">
                <button id="add-cancel" class="add-btn add-cancel" type="button">Cancel</button>
                <button id="add-submit" class="add-btn add-submit" type="submit">Add</button>
            </div>
        </form>
    </dialog>

    <!-- Passing confirmations, shown for about 4 seconds. -->
    <div class="toast-region" role="status">
        <div id="toast" class="toast" hidden>
            <span id="toast-text"></span>
            <button id="toast-action" class="toast-action" type="button" hidden></button>
        </div>
    </div>

    <footer class="hints">
        <span id="hints-search">
            <span><kbd>↑↓</kbd>Navigate</span>
            <span><kbd class="key-mac">↩</kbd><kbd class="key-other">Enter</kbd>Open</span>
            <span><kbd class="key-mac">⌘N</kbd><kbd class="key-other">Ctrl+N</kbd>Add</span>
            <span><kbd class="key-mac">esc</kbd><kbd class="key-other">Esc</kbd>Clear</span>
        </span>
        <span id="status" class="status" role="status"></span>
        <span id="result-count" class="count"></span>
    </footer>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
